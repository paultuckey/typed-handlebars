# The changelog lives at the workspace root, but `pre-release-replacements` resolves paths per
# package and runs once per package. Hanging it off this crate alone — rather than the workspace
# — is what keeps a release from rewriting the same file twice.
pre-release-replacements = [
  { file = "../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] — {{date}}", exactly = 1 },
  { file = "../CHANGELOG.md", search = "compare/v[0-9.]+\\.\\.\\.HEAD", replace = "compare/v{{version}}...HEAD", exactly = 1 },
  { file = "../CHANGELOG.md", search = "\\.\\.\\.HEAD\n", replace = "...HEAD\n[{{version}}]: https://github.com/paultuckey/typed-handlebars/releases/tag/v{{version}}\n", exactly = 1 },
]
